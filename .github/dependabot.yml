version: 2

# One grouped PR per ecosystem per month. Ungrouped weekly updates produced
# 21 separate PRs in a single hour, every one of which conflicted with the
# others on a lockfile.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cli-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint peers on typescript >=4.8.4 <6.1.0, so a TypeScript 7
      # bump makes the whole group unresolvable. Revisit when it supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # ui/ resolves through pnpm-lock.yaml, which is what Vercel installs from.
  # Dependabot's npm ecosystem handles pnpm lockfiles.
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      site-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
