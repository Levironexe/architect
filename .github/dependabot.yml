version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint peers on typescript >=4.8.4 <6.1.0, so a TypeScript 7
      # bump makes the whole group unresolvable. Revisit when it supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  # ui/ resolves through pnpm-lock.yaml, which is what Vercel installs from.
  # Dependabot's npm ecosystem handles pnpm lockfiles.
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
