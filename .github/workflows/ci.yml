name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check the messy fixture reports violations
        run: |
          node dist/cli/index.js check tests/fixtures/messy-nextjs --no-color && \
            { echo "expected exit 1 on the messy fixture"; exit 1; } || \
            test $? -eq 1

      - name: Check the clean fixture reports none
        run: node dist/cli/index.js check tests/fixtures/clean-nextjs --no-color

      - name: Audit
        run: npm audit --audit-level=high
